[package]
name = "yard"
version = "1.0.0"
description = "Yard — offline batch file processing"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "~2.7"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
sysinfo = "0.39"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
plist = "1"
tempfile = "3"
filetime = "0.2"
tauri = { version = "2.12", features = ["test"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "macos_menu"
harness = false


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
