name: Bug report
description: Something in Yard does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. Follow [SECURITY.md](https://github.com/initgrep-apps/yard/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add these files...
        2. Set the target to...
        3. Press Compress...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Yard version
      description: Shown in the About dialog or the installer filename.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Windows (arm64)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal file names and paths before posting.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
